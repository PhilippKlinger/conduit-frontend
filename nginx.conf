server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Send client-side routes back to Angular instead of returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built assets use hashed filenames and can be cached for a long time.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Always revalidate the entry page so it can reference the newest assets.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
